name: Self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Scans a fixture with a known-vulnerable crate. soft-fail keeps the job green
  # while asserting the action detected the vulnerability.
  detects-vulnerable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scan
        uses: ./
        with:
          path: test/fixtures/Cargo.lock
          soft-fail: "true"
      - name: Assert a vulnerability was found
        run: |
          echo "total=${{ steps.scan.outputs.total }}"
          test "${{ steps.scan.outputs.total }}" -ge 1

  # A clean set must pass with the default (hard) fail mode.
  passes-when-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf '[[package]]\nname = "serde"\nversion = "1.0.210"\n' > /tmp/Clean.lock
      - uses: ./
        with:
          path: /tmp/Clean.lock
          format: cargo

  # Two lockfiles, anonymous: the second scan has to wait out the server's
  # cooldown (10 s per IP) instead of failing on a 429.
  multi-file-cooldown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scan
        uses: ./
        with:
          path: |
            test/fixtures/Cargo.lock
            test/fixtures/package-lock.json
          soft-fail: "true"
      - name: Assert both lockfiles were scanned
        run: |
          echo "total=${{ steps.scan.outputs.total }} incomplete=${{ steps.scan.outputs.incomplete }} high=${{ steps.scan.outputs.high }}"
          test "${{ steps.scan.outputs.total }}" -ge 2
          test "${{ steps.scan.outputs.incomplete }}" = "false"
