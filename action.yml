name: "vuln.mlab.sh SBOM scan"
description: "Scan your lockfiles and SBOMs for known CVEs via vuln.mlab.sh: fail the build, or just report, on vulnerable dependencies."
author: "mlab.sh"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: >
      Lockfile(s) or SBOM(s) to scan, newline- or comma-separated. When empty,
      supported lockfiles are auto-detected under `working-directory`.
    required: false
    default: ""
  working-directory:
    description: "Base directory to auto-detect lockfiles in."
    required: false
    default: "."
  format:
    description: >
      Force the parser: auto | npm | yarn | pnpm | cargo | pip | poetry | uv | pdm | pipfile |
      composer | gem | go | maven | nuget | pub | hex | mise | cyclonedx | spdx.
    required: false
    default: "auto"
  fail-on:
    description: >
      Minimum severity that fails the build: any | critical | high | medium | low | none.
      `any` fails on any finding (incl. unknown severity); `none` never fails on findings.
      Ignored when .mlab/vuln.yml has `block:` or `warn:` gate rules.
    required: false
    default: "any"
  fail-on-incomplete:
    description: >
      If 'true', also fail when the scan did not cover every package: a manifest cut at
      your tier's package limit, entries the server could not scan (git or path
      dependencies, unpinned versions), or packages left unchecked during an outage.
      Always reported either way.
    required: false
    default: "false"
  soft-fail:
    description: "If 'true', never set a failing exit code: report findings and outputs only."
    required: false
    default: "false"
  token:
    description: >
      vuln.mlab.sh API token (Authorization: Bearer), from https://vuln.mlab.sh/me/tokens.
      Applies your account's limits: 1024 packages per lockfile and a 5 s cooldown on a
      free account, 4096 and none on a paid plan (anonymous: 512 and 10 s per IP).
    required: false
    default: ""
  api-url:
    description: "Scan endpoint."
    required: false
    default: "https://vuln.mlab.sh/api/v2/scan"
  sarif-file:
    description: "Write the findings as SARIF 2.1.0 to this path. Empty: no file, unless upload-sarif is set (then a temp file)."
    required: false
    default: ""
  upload-sarif:
    description: >
      If 'true', upload the SARIF to GitHub Code Scanning (Security tab). Needs
      `permissions: security-events: write`; code scanning must be available on the repo.
    required: false
    default: "false"
  monitor:
    description: >
      If 'true', on a push to the default branch, register each scanned lockfile on
      vuln.mlab.sh for continuous monitoring (rescanned from the branch tip, alerts on
      new CVEs). Needs `token` from an account on a Pro plan. Never fails the build.
    required: false
    default: "false"
  monitor-source-token:
    description: >
      For a private repository: a read-only token mlab sends to fetch the lockfiles on
      each rescan (raw.githubusercontent.com). Stored by vuln.mlab.sh; use a fine-grained,
      contents:read token, not GITHUB_TOKEN (it expires with the job).
    required: false
    default: ""
  badge-file:
    description: >
      Write a README badge (SVG, the 0-100 score) to this path, e.g. .github/badges/vulns.svg.
      The Action only writes the file: commit it in a later step.
    required: false
    default: ""
  attestation-predicate:
    description: >
      Write the scan as an in-toto vulnerability predicate (vulns/v0.1) to this path,
      for actions/attest to sign and bind to your artifact and commit.
    required: false
    default: ""
  github-token:
    description: "Token for the GitHub API (SARIF upload)."
    required: false
    default: ${{ github.token }}

outputs:
  total:
    description: "Number of vulnerabilities found across all scanned lockfiles (one per package and CVE)."
  vulnerable-packages:
    description: "Number of distinct vulnerable packages found."
  critical:
    description: "Findings of critical severity."
  high:
    description: "Findings of high severity."
  medium:
    description: "Findings of medium severity."
  low:
    description: "Findings of low severity."
  unknown:
    description: "Findings without a known severity."
  incomplete:
    description: "'true' if some package was not scanned (limit, unscannable entry, outage, or a lockfile that failed)."
  not-scanned:
    description: "Number of packages left out because a manifest exceeded the package limit."
  failed:
    description: "'true' if a block gate rule fired (by default: fail-on threshold met, a lockfile could not be scanned, or incomplete with fail-on-incomplete), regardless of soft-fail."
  score:
    description: "0 to 100: 100 with no finding, minus 20 a critical, 10 a high, 4 a medium, 1 a low, 2 an unknown, 20 more when in KEV."
  attestation-predicate:
    description: "Path of the attestation predicate written, when one was."
  attestation-predicate-type:
    description: "Its predicate type, to pass to actions/attest: https://in-toto.io/attestation/vulns/v0.1."
  sarif-file:
    description: "Path of the SARIF file written, when one was."

runs:
  using: "node24"
  main: "dist/index.js"
